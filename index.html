<script>
const D={"cards":[{"n":1,"q":"What is Meta Certification?","a":"A recognition of advanced-level proficiency with Facebook, Messenger, and Instagram.","d":"BME1","f":"","x":[79,86,87,82,99,101,2]},{"n":2,"q":"What does the Meta Certified Business Messaging Strategy Exam measure?","a":"The ability to design an end-to-end marketing strategy that aligns with business goals using Meta technologies.","d":"BME2","f":"","x":[173,267,144,147,151,247,17]},{"n":3,"q":"What are the three largest messaging apps owned by Meta?","a":"Messenger, Instagram, and WhatsApp.","d":"BME1","f":"","x":[119,276,217,221,262,84,127]},{"n":4,"q":"What is the primary purpose of Meta Business Messaging?","a":"To enable businesses to engage in meaningful interactions with customers on their preferred messaging channels.","d":"BME1","f":"","x":[250,268,87,23,19,173,262]},{"n":5,"q":"How can Business Messaging improve customer service?","a":"By providing 24/7 customer support and resolving issues in real time.","d":"BME1","f":"","x":[21,19,18,138,151,214,227]},{"n":6,"q":"What role does marketing automation play in Business Messaging?","a":"It automates marketing campaigns by sending personalized messages based on customer interests and behaviors.","d":"BME1","f":"","x":[140,243,271,252,19,275,144]},{"n":7,"q":"How does Business Messaging facilitate sales enablement?","a":"By allowing real-time interactions with customers for browsing products and placing orders.","d":"BME1","f":"","x":[14,146,252,267,25,18,4]},{"n":8,"q":"What is the function of Business Messaging Partners?","a":"To collaborate with Meta to deliver comprehensive messaging solutions and enhance capabilities.","d":"BME3","f":"","x":[268,10,262,4,144,212,98]},{"n":9,"q":"What are Solution Partners responsible for?","a":"Providing access to the WhatsApp Business Platform and managing infrastructure.","d":"BME1","f":"","x":[269,113,261,274,127,271,233]},{"n":10,"q":"What do Tech Partners add to Business Messaging?","a":"Niche software and solutions that expand the capabilities of WhatsApp.","d":"BME1","f":"","x":[8,24,19,27,267,33,262]},{"n":11,"q":"What services do Service Partners provide?","a":"Designing strategies and messaging journeys, and performing customer development and measurement services.","d":"BME4","f":"","x":[8,274,17,12,166,210,189]},{"n":12,"q":"What is a Communication Platform as a Service (CPaaS)?","a":"A service that offers end-to-end solutions for messaging, including integration and omnichannel management.","d":"BME1","f":"","x":[137,274,270,73,63,103,69]},{"n":13,"q":"What is the role of Conversational Commerce platforms?","a":"To provide tools for merchants to enable commerce activities over messaging.","d":"BME1","f":"","x":[74,243,102,72,98,79,25]},{"n":14,"q":"How do chat automation partners contribute to Business Messaging?","a":"By designing chatbots that engage customers and automate tasks.","d":"BME1","f":"","x":[10,8,98,6,33,17,271]},{"n":15,"q":"What is the benefit of using Marketing Automation platforms?","a":"They help businesses market to their audience and streamline repetitive tasks.","d":"BME1","f":"","x":[219,54,211,13,6,218,159]},{"n":16,"q":"What do Customer Care platforms focus on?","a":"Unifying customer service channels and managing chat ticketing for agents.","d":"BME1","f":"","x":[241,108,13,157,140,15,27]},{"n":17,"q":"What is the purpose of Measurement partners in Business Messaging?","a":"To enable down-funnel campaign performance measurement and provide insights.","d":"BME4","f":"","x":[8,250,23,244,144,22,10]},{"n":18,"q":"How can partners work together in a Business Messaging strategy?","a":"By collaborating to ensure the success of campaigns through their specialized roles.","d":"BME3","f":"","x":[10,8,22,33,17,23,138]},{"n":19,"q":"What is the importance of customer feedback in Business Messaging?","a":"It allows businesses to collect real-time suggestions and improve services.","d":"BME1","f":"","x":[262,25,151,23,88,94,173]},{"n":20,"q":"What is a key use case for Business Messaging in event management?","a":"Managing events and providing updates and feedback channels for attendees.","d":"BME2","f":"","x":[168,212,272,148,10,250,254]},{"n":21,"q":"How does Business Messaging support customer retention?","a":"By sending personalized messages to keep customers engaged with new products.","d":"BME2","f":"","x":[5,146,27,19,14,214,151]},{"n":22,"q":"What is the significance of onboarding in a Business Messaging strategy?","a":"It ensures that businesses effectively implement and optimize their messaging strategies.","d":"BME4","f":"","x":[25,254,151,27,23,8,144]},{"n":23,"q":"What is the Business Messaging maturity model?","a":"A framework that helps businesses assess and improve their messaging strategies.","d":"BME2","f":"","x":[142,247,4,25,151,19,147]},{"n":24,"q":"What are actionable strategies in Business Messaging?","a":"Strategies that can be implemented to optimize messaging effectiveness and engagement.","d":"BME4","f":"","x":[118,212,261,37,100,268,153]},{"n":25,"q":"What is A/B Testing in the context of Business Messaging?","a":"A method to compare two versions of a message to determine which performs better.","d":"BME4","f":"","x":[265,8,143,145,147,254,23]},{"n":26,"q":"What does it mean to help clients pivot to a new strategy?","a":"Assisting clients in adapting their messaging approach to meet changing business needs.","d":"BME2","f":"","x":[114,273,120,110,135,116,2]},{"n":27,"q":"What is the customer journey framework in Business Messaging?","a":"A structure that outlines the stages a customer goes through when interacting with a business.","d":"BME2","f":"","x":[264,151,119,98,254,144,145]},{"n":28,"q":"What is the primary use case for the campaign discussed?","a":"Lead generation","d":"BME2","f":"Thiếu ngữ cảnh (hỏi về “the campaign discussed” nhưng không nêu chiến dịch nào).","x":[150,47,247,76,149,273,133]},{"n":29,"q":"What platform is used for developing chatbots in the campaign?","a":"WhatsApp Business Platform","d":"BME1","f":"Thiếu ngữ cảnh.","x":[270,47,54,61,59,248,67]},{"n":30,"q":"What role does the solution partner play in the campaign?","a":"Provides tools like WhatsApp Business Platform and chatbot software","d":"BME1","f":"Thiếu ngữ cảnh.","x":[243,271,140,95,121,56,239]},{"n":31,"q":"What is the agency responsible for in the campaign?","a":"Campaign ideation, ad creative development, and messaging journeys","d":"BME2","f":"Thiếu ngữ cảnh.","x":[9,95,67,51,270,47,216]},{"n":32,"q":"What is the tech partner’s role in the campaign?","a":"Connects systems, tracks results, and builds dashboards for real-time results","d":"BME4","f":"Thiếu ngữ cảnh.","x":[51,13,74,172,76,260,152]},{"n":33,"q":"How do agencies differ from tech partners in messaging strategy?","a":"Agencies work with CMOs and CEOs, focusing on brand and results, while tech partners connect with CTOs and customer service teams.","d":"BME1","f":"","x":[14,10,5,46,254,45,140]},{"n":34,"q":"What is stakeholder mapping?","a":"A tool to visualize relationships, influence, and authority dynamics within an organization.","d":"BME2","f":"","x":[36,210,41,123,263,148,261]},{"n":35,"q":"What should you identify when mapping stakeholders?","a":"Key decision makers, influencers, their roles, influence, and specific needs.","d":"BME2","f":"","x":[125,34,228,130,166,184,1]},{"n":36,"q":"What is the purpose of using an influence matrix in stakeholder mapping?","a":"To understand authority dynamics and alignment with proposals.","d":"BME2","f":"","x":[34,87,72,17,244,117,105]},{"n":37,"q":"What are the four key areas of Meta Business Messaging solutions?","a":"Build a presence, manage sales and leads, engage in conversations, and optimize campaigns.","d":"BME4","f":"","x":[265,25,252,24,19,168,20]},{"n":38,"q":"What is the function of ads that click to message?","a":"To enable businesses to reach audiences and initiate conversations directly.","d":"BME1","f":"","x":[259,44,105,136,270,239,46]},{"n":39,"q":"What are marketing messages used for?","a":"To reconnect with audiences, boost sales, and build loyalty through timely updates and personalized offers.","d":"BME2","f":"","x":[9,111,133,218,41,265,127]},{"n":40,"q":"What is required before sending marketing messages to customers?","a":"Consent from customers who have a prior relationship with the business.","d":"BME1","f":"","x":[89,39,249,200,211,74,269]},{"n":41,"q":"What are WhatsApp Flows?","a":"Structured messaging interactions that businesses can customize for various use cases.","d":"BME2","f":"","x":[43,274,248,259,127,261,233]},{"n":42,"q":"What is the difference between the WhatsApp Business Platform and the WhatsApp Business app?","a":"The WhatsApp Business Platform is an API for medium to large businesses, while the app is for smaller businesses.","d":"BME1","f":"","x":[270,59,54,69,63,56,248]},{"n":43,"q":"What can businesses do with WhatsApp Flows?","a":"Define, configure, and customize messages for interactions like loan applications and insurance quotes.","d":"BME1","f":"","x":[41,61,70,92,73,55,58]},{"n":44,"q":"What is the goal of using ads that click to Messenger?","a":"To engage in personalized and timely interactions with customers.","d":"BME1","f":"","x":[38,259,198,147,216,172,249]},{"n":45,"q":"What is the benefit of using data from Messenger and WhatsApp in a messaging strategy?","a":"To offer better measurement and demonstrate the impact of the strategy.","d":"BME4","f":"","x":[2,44,22,15,230,25,244]},{"n":46,"q":"What is the primary focus of agencies in a messaging strategy?","a":"To provide creative ideas and integrate messaging into the overall strategy.","d":"BME1","f":"","x":[247,22,250,25,230,217,4]},{"n":47,"q":"What are the key motivations for stakeholders in a mapping exercise?","a":"Their specific goals and how they align with the investment.","d":"BME2","f":"","x":[106,157,240,67,52,39,171]},{"n":48,"q":"What should businesses do to enhance customer experience through messaging?","a":"Send rich media like photos, videos, and PDFs.","d":"BME1","f":"","x":[128,138,123,246,103,130,225]},{"n":49,"q":"How can businesses save time when responding to incoming leads?","a":"By using automated responses and tools to manage messages.","d":"BME1","f":"","x":[139,138,55,130,57,43,242]},{"n":50,"q":"What is the importance of tracking specific conversion events?","a":"To measure the effectiveness of the campaign and its alignment with business objectives.","d":"BME1","f":"","x":[19,264,94,188,76,270,143]},{"n":51,"q":"What is the role of the client in the campaign evaluation process?","a":"To set goals and check if the campaign meets them.","d":"BME3","f":"","x":[172,74,191,67,13,262,171]},{"n":52,"q":"What is a key advantage of using Meta technologies for businesses?","a":"To build valuable relationships with customers.","d":"BME1","f":"","x":[201,252,111,157,73,202,82]},{"n":53,"q":"What is the significance of integrating messaging across multiple channels?","a":"To support growth across the organization.","d":"BME1","f":"","x":[100,46,98,217,23,27,173]},{"n":54,"q":"What are some marketing uses of the WhatsApp Business Platform?","a":"Send marketing messages or offer personalized re-engagement.","d":"BME1","f":"","x":[270,56,69,248,62,63,61]},{"n":55,"q":"How can businesses use WhatsApp for commerce?","a":"Offer shopping experiences within conversations on WhatsApp.","d":"BME1","f":"","x":[58,57,139,43,242,138,49]},{"n":56,"q":"What utility does the WhatsApp Business Platform provide?","a":"Send real-time updates and reminders to customers who opt in.","d":"BME1","f":"","x":[270,59,248,63,90,42,61]},{"n":57,"q":"What is one way businesses can provide customer service using WhatsApp?","a":"Provide customer service at scale through conversations.","d":"BME3","f":"","x":[43,73,70,107,108,56,78]},{"n":58,"q":"How can WhatsApp be used for authentication?","a":"Verify identities and authenticate people by sending one-time passcodes.","d":"BME1","f":"","x":[55,227,5,139,97,43,49]},{"n":59,"q":"What is the Cloud API in the context of the WhatsApp Business Platform?","a":"All messages are sent through the Cloud API, hosted by Meta.","d":"BME1","f":"","x":[270,88,56,42,63,98,54]},{"n":60,"q":"What options do businesses have regarding message data storage?","a":"Businesses can control where their message data is stored at rest with local storage.","d":"BME1","f":"","x":[259,43,38,48,68,101,136]},{"n":61,"q":"What types of integrations can the WhatsApp Business Platform connect with?","a":"API integrations can connect to chatbots, CRM, websites, agent chat interfaces, reservations systems, and inventory management.","d":"BME1","f":"","x":[270,63,69,54,56,62,59]},{"n":62,"q":"What are the messaging rules businesses must follow on the WhatsApp Business Platform?","a":"Businesses must adhere to messaging limits and phone number quality.","d":"BME1","f":"","x":[270,69,88,248,54,142,56]},{"n":63,"q":"What is the purpose of verified accounts on the WhatsApp Business Platform?","a":"Businesses can apply for an official business account with a verified badge.","d":"BME1","f":"","x":[56,59,248,4,42,62,54]},{"n":64,"q":"In which countries are payments on WhatsApp available?","a":"Payments on WhatsApp are available in select countries, including Brazil and India.","d":"BME1","f":"Nhạy theo thời gian: danh sách quốc gia hỗ trợ thanh toán trên WhatsApp chưa xác minh được từ nguồn chính thức.","x":[41,69,248,230,78,265,269]},{"n":65,"q":"What are catalogs in the context of the WhatsApp Business Platform?","a":"Catalogs are available to businesses, but do not yet support variables.","d":"BME1","f":"Chưa xác minh: tính năng catalog/variables có thể đã thay đổi.","x":[59,54,248,69,56,63,88]},{"n":66,"q":"What feature allows businesses to send automated replies?","a":"Customized auto responses are available to businesses.","d":"BME1","f":"","x":[70,73,60,154,103,252,101]},{"n":67,"q":"What is the process for phone number migration on WhatsApp?","a":"Phone number migration can be done through the embedded signup flow or through an API.","d":"BME1","f":"","x":[191,171,68,69,88,63,194]},{"n":68,"q":"What language support is available for message templates on WhatsApp?","a":"Multi-language support is available for message templates and messages in general.","d":"BME3","f":"","x":[89,223,193,98,59,47,188]},{"n":69,"q":"What analytics features are available on the WhatsApp Business Platform?","a":"Template analytics are available, such as the number of link clicks.","d":"BME1","f":"","x":[248,270,56,54,62,63,98]},{"n":70,"q":"What types of interactions can businesses send via WhatsApp?","a":"Businesses can send coupon codes, limited-time offers, add to cart buttons, and reply buttons.","d":"BME1","f":"","x":[43,61,62,92,91,93,48]},{"n":71,"q":"What are the four categories of business-initiated messages on WhatsApp?","a":"Utility, Authentication, Service, and Marketing.","d":"BME1","f":"Mâu thuẫn: Service là tin nhắn do KHÁCH chủ động (trong cửa sổ 24h), không phải business-initiated (xem thẻ 90–91). Chỉ dùng 3 loại Utility/Authentication/Marketing cho business-initiated.","x":[54,69,62,142,90,63,84]},{"n":72,"q":"What is the purpose of utility messages?","a":"Utility messages enable businesses to send non-promotional, transactional updates.","d":"BME1","f":"","x":[137,269,74,244,87,73,63]},{"n":73,"q":"What do service messages allow businesses to do?","a":"Service messages enable businesses to respond to customer inquiries and provide support.","d":"BME1","f":"","x":[137,12,74,269,72,48,43]},{"n":74,"q":"What is the role of authentication messages?","a":"Authentication messages enable businesses to verify user identities and authenticate transactions.","d":"BME1","f":"","x":[72,137,269,13,262,73,51]},{"n":75,"q":"How does pricing work for conversations on the WhatsApp Business Platform?","a":"Pricing varies based on conversation category and region, with different rates for marketing, utility, and authentication conversations.","d":"BME1","f":"Lỗi thời: từ 01/07/2025 WhatsApp tính phí theo từng tin nhắn (per-message), không còn theo hội thoại (conversation). Nguồn: developers.facebook.com/docs/whatsapp/pricing","x":[56,248,42,270,59,62,98]},{"n":76,"q":"What is the Conversions API?","a":"The Conversions API creates a direct connection between marketing data and Meta to optimize audience targeting and measure results.","d":"BME4","f":"","x":[77,250,260,135,23,143,15]},{"n":77,"q":"What is required to implement the Conversions API?","a":"Businesses need to set up a cross-organizational taskforce and select necessary permissions during embedded signup.","d":"BME4","f":"","x":[76,250,159,238,216,260,72]},{"n":78,"q":"How do payments on WhatsApp enhance customer experience?","a":"Payments on WhatsApp simplify transactions within the app, reducing friction and improving the overall experience.","d":"BME1","f":"","x":[214,55,48,132,58,43,70]},{"n":79,"q":"What do the Commerce Policies on Meta outline?","a":"The rules and regulations for buying, selling, and promoting products on Meta technologies.","d":"BME1","f":"","x":[102,80,81,87,84,83,4]},{"n":80,"q":"What types of items are prohibited under Meta’s Commerce Policies?","a":"Drugs, weapons, and adult content.","d":"BME1","f":"","x":[79,81,99,86,102,83,195]},{"n":81,"q":"What must sellers disclose according to Meta’s Commerce Policies?","a":"Payment terms, including prices, shipping costs, and return policies.","d":"BME1","f":"","x":[83,79,102,80,1,85,103]},{"n":82,"q":"What is required for products sold on Meta?","a":"Products must meet safety standards and regulations.","d":"BME1","f":"","x":[1,52,86,39,273,263,79]},{"n":83,"q":"What rights must sellers respect according to Meta’s Commerce Policies?","a":"Intellectual property rights, including trademarks, copyrights, and patents.","d":"BME1","f":"","x":[81,79,102,104,80,103,85]},{"n":84,"q":"What are the Meta Business Tools Terms?","a":"A set of rules rictions.","d":"BME1","f":"","x":[90,88,54,56,41,248,69]},{"n":94,"q":"What is the importance of aligning messaging strategies with business goals?","a":"To ensure that messaging efforts support the specific objectives of the business.","d":"BME2","f":"","x":[117,100,19,118,25,23,144]},{"n":95,"q":"What does SMART stand for in the context of KPIs?","a":"Specific, Measurable, Achievable, Relevant, Time-bound.","d":"BME2","f":"","x":[263,141,276,47,113,115,241]},{"n":96,"q":"Why is it important to engage stakeholders when identifying KPIs?","a":"To ensure that the KPIs reflect the needs and objectives of the business.","d":"BME2","f":"","x":[202,125,35,193,183,225,117]},{"n":97,"q":"How should KPIs be tailored for different business groups?","a":"KPIs should reflect the unique objectives and challenges of each business group.","d":"BME4","f":"","x":[184,113,107,168,115,20,225]},{"n":98,"q":"What is the role of automation in WhatsApp Business Messaging?","a":"Businesses can use automation during the 24-hour customer service window but must provide clear escalation paths to human agents.","d":"BME3","f":"","x":[262,270,88,23,19,268,17]},{"n":99,"q":"What are some examples of prohibited content in Meta advertising?","a":"Ads containing adult content, sensationalism, or unsafe substances.","d":"BME1","f":"","x":[86,87,1,54,41,269,101]},{"n":100,"q":"What is the significance of understanding business goals in messaging strategies?","a":"It helps in determining the appropriate KPIs to measure success effectively.","d":"BME2","f":"","x":[94,173,22,151,147,23,254]},{"n":101,"q":"What should businesses do to ensure compliance with Meta’s Advertising Standards?","a":"Follow guidelines related to content, targeting, and payment.","d":"BME3","f":"","x":[103,87,43,1,180,192,86]},{"n":102,"q":"What is the consequence of not complying with Meta’s Commerce Policies?","a":"Sellers may face penalties, including account suspension or removal from the platform.","d":"BME1","f":"","x":[79 ional content. Which template category applies?","o":["Utility","Marketing","Authentication","Service"],"c":[0],"e":"Nhắc lịch hẹn, cập nhật đơn hàng, hóa đơn, cảnh báo gian lận… là Utility (không quảng cáo).","s":"BME1.02"},{"d":"BME1","q":"A bank wants to send a one-time passcode for login and account recovery. Which template category applies?","o":["Authentication","Utility","Marketing","Service"],"c":[0],"e":"Authentication chỉ dùng cho mã xác thực một lần (OTP).","s":"BME1.02"},{"d":"BME1","q":"Which TWO principles make business messages effective and engaging? (Choose 2)","o":["Expected: the customer opted in for that type of content","Relevant: personalized, useful, with a clear call to action","Frequent: sent as often as possible to maximize reach","Generic: one identical broadcast for every customer","Minimal: as little information as possible"],"c":[0,1],"e":"Hai nguyên tắc vàng: Expected (đã opt-in) và Relevant (cá nhân hóa, có CTA). Tần suất dày hoặc thiếu thông tin đều kém hiệu quả.","s":"BME1.02"},{"d":"BME1","q":"A business wants to scale Business Messaging. Which TWO value propositions best justify the investment? (Choose 2)","o":["End-to-end conversational journey support","Measurement, attribution, and cross-platform comparison","Guaranteeing a fixed level of ROI","Replacing all human agents with automation","Reducing the number of customer touchpoints to zero"],"c":[0,1],"e":"Hai lợi thế cốt lõi: hành trình hội thoại đầu-cuối và đo lường/phân bổ/so sánh đa nền tảng. Cam kết ROI cố định là đáp án bẫy.","s":"BME1.03, Phần 3 #2"},{"d":"BME2","q":"A brand in the Consideration stage is launching a new product and wants many people to engage (quiz, advice). Which entry point is most effective?","o":["Click-to-WhatsApp ads","A link in an organic post","Redirecting through an intermediary website first","A printed brochure without a link"],"c":[0],"e":"CTWA đưa người dùng thẳng vào chat; các bước trung gian tăng ma sát và giảm chuyển đổi.","s":"BME2.01"},{"d":"BME2","q":"An agency has a strong relationship with the client’s CMO. What is the biggest advantage for the messaging strategy?","o":["Insight into the company’s overall marketing vision","Faster ad approval inside Ads Manager","A guaranteed larger ad budget","Fewer stakeholders to manage"],"c":[0],"e":"Quan hệ với CMO giúp nắm tầm nhìn marketing tổng thể để gắn giải pháp với mục tiêu kinh doanh cốt lõi.","s":"BME2.01"},{"d":"BME2","q":"Which statement best describes a messaging journey in Meta’s framework?","o":["A two-way conversation with multiple touchpoints and interactions","A rigid linear process with one message","A one-way broadcast to all contacts","A single automated reply"],"c":[0],"e":"Messaging journey là đối thoại hai chiều, nhiều điểm chạm, không phải quy trình tuyến tính cứng nhắc.","s":"BME2.02"},{"d":"BME2","q":"A strategist begins designing a messaging journey aligned with a client’s business goals. What is the first step?","o":["Identify the key performance indicators (KPIs)","Create the ad content","Build a complex chatbot","Select the messaging partner"],"c":[0],"e":"Chốt mục tiêu/KPI trước, rồi mới nội dung, chatbot, đối tác (trình tự Strategy → Rules → Content → Measurement). Lưu ý: thẻ Quizlet #124 diễn đạt là “business outcome”.","s":"BME2.02, Phần 3 #5"},{"d":"BME2","q":"A startup is new to AI and automation and wants to manage conversations with AI. What should it do first?","o":["Build clear guidelines and known constraints for the AI (e.g., when to hand over to a human)","Replace its customer service team with a bot","Launch a fully automated bot with no human interaction","Add as many automated flows as possible"],"c":[0],"e":"Doanh nghiệp mới: thiết lập quy tắc và giới hạn trước; không thay thế hoàn toàn con người ngay từ đầu.","s":"BME2.03"},{"d":"BME2","q":"A mature business wants deeper customer relationships and more repeat purchases. Which TWO actions should it prioritize? (Choose 2)","o":["Sophisticated in-thread experiences with personalized content","Optimizing conversion points","Increasing the number of promotional messages sent","Creating a new WhatsApp Business Account to separate marketing from sales","Reducing the number of stakeholders"],"c":[0,1],"e":"Doanh nghiệp trưởng thành: trải nghiệm chuyên sâu trong luồng chat + tối ưu điểm chuyển đổi.","s":"BME2.03"},{"d":"BME3","q":"Which THREE criteria are core to matching a business with a Business Messaging Partner? (Choose 3)","o":["Vertical (industry experience)","Country (support in the target market)","Existing partners in the tech architecture","Number of employees","Size of the partner’s social media following"],"c":[0,1,2],"e":"Ba tiêu chí: ngành hàng, quốc gia, đối tác công nghệ hiện có trong kiến trúc. Số nhân viên/mạng xã hội không phải tiêu chí chính.","s":"BME3.01"},{"d":"BME3","q":"A business needs to integrate the WhatsApp API into its existing systems, configure it, and develop an automated chatbot. Which partner type does it need?","o":["Business Messaging Partner","Creative agency","Meta sales representative","Media-buying agency"],"c":[0],"e":"Tích hợp API, cấu hình kỹ thuật và chatbot là việc của Business Messaging Partner.","s":"BME3.01"},{"d":"BME3","q":"To tie a messaging expansion closely to overall marketing performance, which capability must the partner have?","o":["Measurement and analytics capabilities","A large creative team","The lowest fees","A global office network"],"c":[0],"e":"Cần năng lực đo lường và phân tích dữ liệu.","s":"BME3.01"},{"d":"BME3","q":"A client approves the strategist’s proposal to run Click-to-WhatsApp ads with a conversational journey. What is the immediate next step?","o":["Define objectives and conversion points","Create the ad content","Conduct broad market research","Build the full chatbot"],"c":[0],"e":"Sau khi khách đồng ý: xác định mục tiêu cụ thể và điểm chuyển đổi trước khi làm nội dung.","s":"BME3.02"},{"d":"BME3","q":"A business with a dedicated team and early results wants to scale sustainably. Which TWO steps come next? (Choose 2)","o":["Identify the touchpoints consumers use most and deploy WhatsApp there","Implement a robust analytics platform through the WhatsApp API","Increase the number of active messages sent","Minimize the number of stakeholders"],"c":[0,1],"e":"Mở rộng bền vững: đặt giải pháp ở điểm chạm dùng nhiều nhất + nền tảng phân tích mạnh qua API.","s":"BME3.02"},{"d":"BME4","q":"A business wants to increase sales while lowering cost versus other channels. Which metric matters most?","o":["Cost per purchase","Cost per message","Total number of active users","Follower growth rate"],"c":[0],"e":"Mục tiêu bán hàng/chi phí → chỉ số cuối phễu (cost per purchase / cost of conversion). Các chỉ số bề nổi là đáp án bẫy.","s":"BME4.01, Phần 3 #3"},{"d":"BME4","q":"A business running Click-to-WhatsApp ads with the Conversions API wants to prove how many additional leads the campaign truly generated. Which method is best?","o":["Conversion Lift study","Brand Lift study","Counting page views","Comparing follower counts"],"c":[0],"e":"Conversion Lift đo tác động tăng thêm (incremental) thực sự.","s":"BME4.01"},{"d":"BME4","q":"Engagement rates are dropping. What is the most direct fix?","o":["Personalize content and refine targeting","Send more messages more often","Remove opt-in requirements","Stop measuring engagement"],"c":[0],"e":"Cá nhân hóa nội dung và tinh chỉnh đối tượng. Tăng tần suất đi ngược nguyên tắc bảo vệ trải nghiệm người dùng.","s":"BME4.02, Phần 3 #4"},{"d":"BME4","q":"Engagement is high but conversion is low, and the client hesitates to switch to a new chatbot flow. What should the strategist recommend?","o":["Run an A/B test comparing the new flow with the current one","Switch all traffic immediately","Guarantee a specific ROI","Cancel the chatbot project"],"c":[0],"e":"Giải pháp ít rủi ro, dựa trên dữ liệu: A/B testing.","s":"BME4.02, Phần 3 #2"},{"d":"BME4","q":"After a campaign launches, what is the most effective way to support the business on an ongoing basis?","o":["Schedule regular check-ins to review performance and adjust","Wait for the client to report problems","Send a final report only at the end","Change partners every month"],"c":[0],"e":"Họp kiểm tra định kỳ để rà soát chỉ số và điều chỉnh kịp thời.","s":"BME4.02"},{"d":"BME4","q":"A business strong on Facebook/Instagram in a country with high WhatsApp usage wants to estimate its WhatsApp opportunity. What is the most reliable data?","o":["Conversion rates from previous campaigns","Total follower count","Number of employees","Number of posts published"],"c":[0],"e":"Dữ liệu đáng tin nhất để ước tính quy mô cơ hội là tỷ lệ chuyển đổi từ các chiến dịch trước.","s":"BME4.03"},{"d":"BME4","q":"A business using WhatsApp only for order and delivery confirmations (Utility) wants more revenue and engagement. Which TWO solutions fit? (Choose 2)","o":["Integrate the WhatsApp Business API with the CRM for personalized marketing campaigns","Build in-thread conversational commerce (catalog and checkout in chat)","Replace WhatsApp with SMS","Send more utility messages with promotional text"],"c":[0,1],"e":"Tích hợp CRM để chạy marketing cá nhân hóa và thương mại hội thoại ngay trong chat. Nhồi quảng cáo vào Utility là sai quy tắc.","s":"BME4.03"}],"ex":[[156,232,-21,209,110,-8,-1,-23,-12,124,-9,166,126,-19,104,265,-24,179,171,-22,38,130,116,55,242,148,107,210,20,186,145,97,96,245,44,191,254,56,111,243,-3,240,-17,93,140,17,1,251,-5,-10,-11,188,215,-7,211,23,-18,-13,88,115],[19,120,165,227,32,157,203,0,-5,128,-16,-19,134,-9,91,236,125,-11,-2,13,-13,180,158,66,223,-3,-17,94,114,67,-1,7,-18,-7,230,-15,-22,181,105,99,262,58,-20,270,187,206,-6,246,-23,-21,-4,95,122,123,142,184,150,235,263,169],[239,273,-17,-15,204,2,40,272,151,260,-20,147,154,-18,217,192,72,127,201,-3,92,22,-4,-11,167,-8,39,182,121,198,15,46,52,170,253,202,271,50,25,35,-23,-12,241,-7,267,225,34,-24,33,-22,53,264,100,-10,-1,118,-9,193,-6,106],[270,-21,-
